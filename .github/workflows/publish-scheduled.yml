name: Publish Scheduled Minoxidil Articles (Every 30 Min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-next-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next queued article
        run: node scripts/publish-next.mjs

      - name: Commit and push if article was published
        run: |
          git config user.name "youminox"
          git config user.email "info@youminox.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "content: Auto-publish scheduled Minoxidil article"
            git push origin main
          else
            echo "No changes to commit."
          fi
